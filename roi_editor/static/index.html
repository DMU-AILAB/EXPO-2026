<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionGuide — ROI Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── header ── */
header {
  background: #16213e;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
}
header h1 { font-size: 16px; color: #e94560; white-space: nowrap; }
.hint { font-size: 11px; color: #666; margin-left: auto; white-space: nowrap; }

/* ── buttons ── */
.btn {
  padding: 6px 13px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.btn-save  { background: #27ae60; color: #fff; }
.btn-save:hover  { background: #2ecc71; }
.btn-prim  { background: #0f3460; color: #fff; }
.btn-prim:hover  { background: #1a5490; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover { background: #e74c3c; }
.btn-sm { font-size: 10px; padding: 3px 7px; }

/* ── layout ── */
main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── viewer ── */
#viewer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
  position: relative;
}
#canvas-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
}
#stream {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 84px);
}
#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  cursor: crosshair;
}
#dualViewWrap {
  display: none;
  width: 100%;
  height: 100%;
  padding: 12px;
  gap: 12px;
  overflow: auto;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}
.dual-cell {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.dual-cell .dual-label {
  color: #eee;
  font-size: 12px;
  font-weight: bold;
  background: #16213e;
  padding: 4px 8px;
  border-radius: 4px 4px 0 0;
}
.dual-cell img {
  max-width: 46vw;
  max-height: 70vh;
  display: block;
  border: 1px solid #0f3460;
}
#no-stream {
  color: #555;
  font-size: 13px;
  text-align: center;
  padding: 40px;
}

/* ── panel ── */
#panel {
  width: 270px;
  background: #16213e;
  border-left: 2px solid #0f3460;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
#conf-section {
  padding: 10px 12px;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
#conf-section label {
  font-size: 11px;
  color: #99a;
  display: block;
  margin-bottom: 4px;
}
#conf-section input[type="range"] {
  width: 100%;
}
#camera-section {
  padding: 10px 12px;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
.scan-result-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f3460;
  border-radius: 5px;
  padding: 6px 8px;
  margin-top: 6px;
  font-size: 11px;
}
.scan-result-item .model { color: #eee; }
.scan-result-item .already { color: #666; font-size: 10px; }
#camera-section label {
  font-size: 11px;
  color: #99a;
  display: block;
  margin-bottom: 4px;
}
#camera-section select,
#camera-section input[type="text"],
#camera-section input[type="number"] {
  width: 100%;
  padding: 5px 8px;
  background: #0f3460;
  border: 1px solid #2a3a60;
  border-radius: 4px;
  color: #eee;
  font-size: 12px;
  margin-bottom: 6px;
}
#camera-section .cam-row {
  display: flex;
  gap: 6px;
}
#camera-section .cam-row > * { flex: 1; }
#camera-section .cam-enabled-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #99a;
  margin-bottom: 6px;
}
#camForm { display: none; margin-top: 6px; }
.zone-type-toggle {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: #ccc;
}
.zone-type-toggle label { display: flex; align-items: center; gap: 4px; margin-bottom: 0; }
.badge-exclude {
  display: inline-block;
  font-size: 10px;
  color: #fff;
  background: #c0392b;
  border-radius: 3px;
  padding: 1px 5px;
  margin-left: 5px;
}
#stats-section {
  padding: 10px 12px;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
.stats-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #99a;
  margin-bottom: 3px;
}
.stats-row b { color: #eee; font-size: 13px; }
#panel-top {
  padding: 10px 12px;
  border-bottom: 1px solid #0f3460;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
}
#roi-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.roi-item {
  background: #0f3460;
  border-radius: 6px;
  padding: 9px 10px;
  margin-bottom: 7px;
}
.roi-item-hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}
.color-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  flex-shrink: 0;
}
.roi-name  { font-weight: bold; font-size: 13px; }
.roi-meta  { font-size: 11px; color: #99a; margin-top: 2px; }

/* ── form ── */
#form-section {
  border-top: 2px solid #0f3460;
  padding: 12px;
  flex-shrink: 0;
}
#form-section h3 {
  font-size: 12px;
  color: #e94560;
  margin-bottom: 9px;
}
.fg { margin-bottom: 8px; }
.fg label {
  font-size: 10px;
  color: #99a;
  display: block;
  margin-bottom: 3px;
}
.fg input {
  width: 100%;
  padding: 5px 8px;
  background: #0f3460;
  border: 1px solid #2a3a60;
  border-radius: 4px;
  color: #eee;
  font-size: 12px;
}
.fg input:focus { outline: none; border-color: #e94560; }
.form-btns { display: flex; gap: 6px; margin-top: 4px; }
.form-btns .btn { flex: 1; }

/* ── status bar ── */
#statusbar {
  background: #0a0a1a;
  padding: 5px 16px;
  font-size: 11px;
  color: #666;
  flex-shrink: 0;
  border-top: 1px solid #0f3460;
}
.s-ok   { color: #27ae60; }
.s-warn { color: #f39c12; }
.s-err  { color: #e74c3c; }
</style>
</head>
<body>

<header>
  <h1>🦯 VisionGuide ROI Editor</h1>
  <span class="hint">클릭: 꼭짓점 추가 &nbsp;|&nbsp; 더블클릭: 완성 &nbsp;|&nbsp; ESC: 취소</span>
  <span id="deviceStatusBar" style="font-size:11px; white-space:nowrap; margin-right:12px"></span>
  <button class="btn btn-prim btn-sm" id="btnDualView">🖥 두 카메라 보기</button>
  <button class="btn btn-save" id="btnSaveAll">💾 전체 저장</button>
</header>

<main>
  <div id="viewer">
    <div id="canvas-wrap">
      <img id="stream" alt="">
      <canvas id="canvas"></canvas>
    </div>
    <div id="dualViewWrap"></div>
    <div id="no-stream" style="display:none">
      카메라 스트림에 연결할 수 없습니다.<br>
      <code>camera_live_pi.py --headless</code> 가 실행 중인지 확인하세요.
    </div>
  </div>

  <div id="panel">
    <div id="camera-section">
      <div id="cameraSelectWrap" style="display:none">
        <label for="cameraSelect">카메라</label>
        <select id="cameraSelect"></select>
        <button class="btn btn-prim btn-sm" id="btnToggleCamForm" style="width:100%">카메라 설정 편집</button>
        <div id="camForm">
          <label>이름표</label>
          <input type="text" id="camLabel" placeholder="예: 정문 CSI 카메라">
          <div class="cam-enabled-row">
            <input type="checkbox" id="camEnabled"> <span>활성화</span>
          </div>
          <div class="cam-row">
            <div>
              <label>연결 방식</label>
              <select id="camBackend">
                <option value="auto">자동</option>
                <option value="picamera2">picamera2 (CSI/UVC)</option>
                <option value="opencv">OpenCV (USB)</option>
              </select>
            </div>
            <div>
              <label>source</label>
              <input type="text" id="camSource" placeholder="0">
            </div>
          </div>
          <div class="cam-row">
            <div>
              <label>회전</label>
              <select id="camRotation">
                <option value="0">0°</option>
                <option value="90">90°</option>
                <option value="180">180°</option>
                <option value="270">270°</option>
              </select>
            </div>
            <div>
              <label>추론 백엔드</label>
              <select id="camInference">
                <option value="auto">자동</option>
                <option value="edgetpu">Coral EdgeTPU</option>
                <option value="tflite">TFLite (CPU)</option>
                <option value="pytorch">PyTorch</option>
              </select>
            </div>
          </div>
          <label>MJPEG 포트</label>
          <input type="number" id="camPort" value="8080">
          <label>탐지 모델</label>
          <select id="camModelVariant"></select>
          <div class="cam-enabled-row">
            <input type="checkbox" id="camSwapRb"> <span>RGB/BGR 반전 (화면 색이 뒤바뀌어 보이면 체크)</span>
          </div>
          <div class="form-btns">
            <button class="btn btn-save" id="btnSaveCamera">저장</button>
            <button class="btn btn-danger" id="btnDeleteCamera">삭제</button>
          </div>
        </div>
      </div>
      <button class="btn btn-prim btn-sm" id="btnScanCameras" style="width:100%">🔍 카메라 검색</button>
      <div id="camScanResults"></div>
    </div>
    <div id="conf-section">
      <label for="fConf">신뢰도 임계값: <span id="confValue">0.55</span></label>
      <input type="range" id="fConf" min="0.1" max="0.95" step="0.05" value="0.55">
    </div>
    <div id="stats-section">
      <div class="stats-row"><span>오늘 유동인구</span><b id="statTotal">-</b></div>
      <div class="stats-row"><span>지팡이 사용자</span><b id="statCane">-</b></div>
    </div>
    <div id="panel-top">
      <span id="roi-count">ROI 목록 (0)</span>
      <button class="btn btn-danger btn-sm" id="btnClearAll">전체 삭제</button>
    </div>
    <div id="roi-list">
      <div class="roi-meta" style="padding:4px">등록된 ROI 없음</div>
    </div>
    <div id="form-section" style="display:none">
      <h3>➕ 새 ROI 정보 입력</h3>
      <div class="fg">
        <label>구역 유형</label>
        <div class="zone-type-toggle">
          <label><input type="radio" name="fZoneType" value="trigger" checked> 🔔 트리거(음성 안내)</label>
          <label><input type="radio" name="fZoneType" value="exclude"> 🚫 제외(감지 안 함)</label>
        </div>
      </div>
      <div class="fg">
        <label>이름 *</label>
        <input id="fName" placeholder="예: 횡단보도">
      </div>
      <div class="fg" id="fTextGroup">
        <label>안내 텍스트 *</label>
        <input id="fText" placeholder="예: 횡단보도 앞입니다">
      </div>
      <div class="fg" id="fAudioGroup">
        <label>오디오 파일 (선택 — PC/폰에서 mp3 선택 시 Pi로 자동 업로드)</label>
        <input type="file" id="fAudioPick" accept="audio/*">
        <div id="audioStatus" class="roi-meta" style="margin-top:4px"></div>
      </div>
      <div class="fg" id="fPriorityGroup">
        <label>우선순위 (낮을수록 높음)</label>
        <input id="fPriority" type="number" value="1" min="1">
      </div>
      <div class="form-btns">
        <button class="btn btn-prim" id="btnAddRoi">ROI 추가</button>
        <button class="btn btn-danger" id="btnCancel">취소</button>
      </div>
    </div>
  </div>
</main>

<div id="statusbar"><span id="status" class="s-ok">서버에 연결 중...</span></div>
<input type="file" id="fAudioPickExisting" accept="audio/*" style="display:none">

<script>
/* ================================================================
   Constants & state
================================================================ */
const COLORS = ['#00dc00','#ff8c00','#00c8ff','#ff00c8','#00ffc8'];

let rois        = [];   // [{name, points, priority, announcement_text, audio_file, zone_type}]
let drawing     = [];   // 현재 그리는 중인 꼭짓점 [[nx,ny], ...]
let pendingPoly = null; // 폼 입력 대기 중인 폴리곤
let mousePos    = null; // canvas 픽셀 좌표 [x, y]
let pendingAudioPath = ''; // 새 ROI 폼에서 업로드된 오디오의 Pi 경로
let audioTargetIndex = null; // 기존 ROI 오디오 변경 시 대상 인덱스
let confThreshold = 0.55; // 탐지 신뢰도 임계값 — camera_live_pi.py가 2초 이내 자동 반영
let cameras       = [];   // GET /api/cameras 결과 — 비어있으면 기존 단일 카메라 UI 그대로
let activeCameraId = null; // 현재 선택된 카메라 id (null = 카메라 프로필 없는 레거시 모드)
let modelVariants = [];   // GET /api/model-variants 결과 — camera_config.MODEL_VARIANTS와 동기화

/* ================================================================
   DOM refs
================================================================ */
const stream     = document.getElementById('stream');
const canvas     = document.getElementById('canvas');
const ctx        = canvas.getContext('2d');
const statusEl   = document.getElementById('status');
const formSec    = document.getElementById('form-section');
const roiListEl  = document.getElementById('roi-list');
const noStream   = document.getElementById('no-stream');
const canvasWrap = document.getElementById('canvas-wrap');
const audioPick  = document.getElementById('fAudioPick');
const audioStatusEl = document.getElementById('audioStatus');
const existingAudioPick = document.getElementById('fAudioPickExisting');
const confInput  = document.getElementById('fConf');
const confValueEl = document.getElementById('confValue');

/* ================================================================
   Stream setup
================================================================ */
function streamUrlFor(port) { return `http://${location.hostname}:${port}/stream.mjpg`; }

function setStream(port) {
  stream.src = streamUrlFor(port);
}

setStream(8080); // 카메라 프로필이 없는 레거시 단일 카메라 기본값 — loadCameras()가 있으면 덮어씀

stream.onload = syncSize;
stream.onerror = () => {
  canvasWrap.style.display = 'none';
  noStream.style.display = 'block';
  setStatus('카메라 스트림 연결 실패 — camera_live_pi.py 실행 여부 확인', 'err');
};

// MJPEG는 onload가 늦게 오므로 폴링으로 보완
setInterval(() => {
  if (stream.offsetWidth > 0 &&
      (canvas.width !== stream.offsetWidth || canvas.height !== stream.offsetHeight)) {
    syncSize();
  }
}, 800);

function syncSize() {
  const w = stream.offsetWidth;
  const h = stream.offsetHeight;
  if (w === 0 || h === 0) return;
  canvas.width  = w;
  canvas.height = h;
  redraw();
}

/* ================================================================
   Camera profiles (다중 카메라 — camera_config.json이 있을 때만 표시)
================================================================ */
const cameraSelectWrap = document.getElementById('cameraSelectWrap');
const cameraSelect   = document.getElementById('cameraSelect');
const camForm        = document.getElementById('camForm');
const camScanResults = document.getElementById('camScanResults');

async function loadModelVariants() {
  try {
    const res = await fetch('/api/model-variants');
    const data = await res.json();
    modelVariants = data.variants || [];
  } catch (e) {
    modelVariants = [];
  }
  const sel = document.getElementById('camModelVariant');
  sel.innerHTML = modelVariants.map(v => `
    <option value="${escAttr(v.key)}">${escHtml(v.label)}</option>
  `).join('');
}

async function loadCameras() {
  try {
    const res = await fetch('/api/cameras');
    const data = await res.json();
    cameras = data.cameras || [];
  } catch (e) {
    cameras = [];
  }
  renderCameraSelector();
  if (cameras.length > 0) {
    const preferred = cameras.find(c => c.id === activeCameraId) || cameras.find(c => c.enabled) || cameras[0];
    switchCamera(preferred.id);
  } else {
    setStream(8080);  // 카메라 프로필이 없으면 레거시 단일 카메라 기본 포트로
  }
}

function renderCameraSelector() {
  if (cameras.length === 0) {
    cameraSelectWrap.style.display = 'none';
    return;
  }
  cameraSelectWrap.style.display = 'block';
  cameraSelect.innerHTML = cameras.map(c => `
    <option value="${escAttr(c.id)}">${escHtml(c.label || c.id)}${c.enabled ? '' : ' (비활성)'}</option>
  `).join('');
  if (activeCameraId) cameraSelect.value = activeCameraId;
  fillCameraForm();
}

/* ── 카메라 검색: libcamera가 인식하는 CSI/UVC 카메라를 스캔해 목록으로 보여주고,
   등록 안 된 카메라는 클릭 한 번으로 프로필을 만들어 저장한다. ── */
document.getElementById('btnScanCameras').addEventListener('click', async () => {
  camScanResults.innerHTML = '<div class="roi-meta" style="padding:4px">검색 중...</div>';
  try {
    const res = await fetch('/api/cameras/scan');
    const data = await res.json();
    if (data.error) {
      camScanResults.innerHTML = `<div class="roi-meta" style="padding:4px">검색 실패: ${escHtml(data.error)}</div>`;
      return;
    }
    if (!data.cameras.length) {
      camScanResults.innerHTML = '<div class="roi-meta" style="padding:4px">인식된 카메라 없음</div>';
      return;
    }
    camScanResults.innerHTML = data.cameras.map(cam => `
      <div class="scan-result-item">
        <span class="model">#${cam.num} ${escHtml(cam.model)}</span>
        ${cam.already_registered
          ? '<span class="already">등록됨</span>'
          : `<button class="btn btn-prim btn-sm" onclick="addCameraFromScan(${cam.num}, '${escAttr(cam.model)}')">+ 추가</button>`}
      </div>
    `).join('');
  } catch (e) {
    camScanResults.innerHTML = `<div class="roi-meta" style="padding:4px">검색 실패: ${escHtml(e.message)}</div>`;
  }
});

async function addCameraFromScan(num, model) {
  const usedIds = new Set(cameras.map(c => c.id));
  let n = 0;
  while (usedIds.has(`cam${n}`)) n++;
  const newId = `cam${n}`;

  const usedPorts = new Set(cameras.map(c => c.port));
  let port = 8080;
  while (usedPorts.has(port) || port === 5000) port++;

  // 물리 Coral 액셀러레이터는 1개뿐 — 이미 활성화된 다른 카메라가 edgetpu를 쓰거나
  // (auto는 Coral을 먼저 시도하므로 auto도 포함) 아직 하나도 없다면 이 새 카메라는
  // Coral을 먼저 시도해도 안전하다. 이미 있다면 충돌을 피해 CPU(tflite)로 기본값을 낮춘다.
  const coralInUse = cameras.some(c => c.enabled && (c.inference_backend === 'edgetpu' || c.inference_backend === 'auto'));
  const inferenceBackend = coralInUse ? 'tflite' : 'auto';

  const newCam = {
    id: newId,
    enabled: true,
    label: model,
    backend: 'picamera2',   // libcamera가 UVC 카메라도 이 경로로 잡아주므로 CSI/USB 공통
    source: String(num),
    rotation: 0,
    inference_backend: inferenceBackend,
    roi_config: `rois_${newId}.json`,
    port: port,
    traffic_db: `foot_traffic_${newId}.db`,
    swap_rb: false,
    model_variant: 'v2_640',
  };

  const updated = [...cameras, newCam];
  try {
    const res = await fetch('/api/cameras', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cameras: updated }),
    });
    if (!res.ok) {
      const body = await res.json();
      throw new Error(Array.isArray(body.detail) ? body.detail.join('; ') : String(body.detail));
    }
    const backendNote = coralInUse ? ' (Coral은 다른 카메라가 이미 사용 중이라 CPU(TFLite)로 지정됨)' : '';

/* ================================================================
   Coordinate helpers
================================================================ */
function toPx(nx, ny)  { return [nx * canvas.width,  ny * canvas.height]; }
function toNorm(px, py) { return [px / canvas.width, py / canvas.height]; }

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

/* ================================================================
   Drawing
================================================================ */
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 저장된 ROIs
  rois.forEach((roi, i) => {
    const isExclude = (roi.zone_type || 'trigger') === 'exclude';
    const color = isExclude ? '#ff3030' : COLORS[i % COLORS.length];
    const label = (isExclude ? '🚫 ' : '') + roi.name;
    drawPoly(roi.points, color, isExclude ? 0.15 : 0.20, label, true, isExclude);
  });

  // 폼 대기 중인 폴리곤
  if (pendingPoly) {
    drawPoly(pendingPoly, '#ffff00', 0.12, '(미저장)', false);
  }

  // 현재 그리는 중
  drawInProgress();
}

function drawPoly(points, color, alpha, label, closed, dashed = false) {
  if (points.length < 2) return;

  ctx.beginPath();
  const [x0, y0] = toPx(points[0][0], points[0][1]);
  ctx.moveTo(x0, y0);
  for (let i = 1; i < points.length; i++) {
    const [x, y] = toPx(points[i][0], points[i][1]);
    ctx.lineTo(x, y);
  }
  if (closed) ctx.closePath();

  // fill
  ctx.fillStyle = color + Math.round(alpha * 255).toString(16).padStart(2, '0');
  ctx.fill();

  // stroke — 제외구역은 점선으로 트리거 구역과 구분
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash(dashed ? [8, 5] : []);
  ctx.stroke();
  ctx.setLineDash([]);

  // vertex dots
  for (const p of points) {
    const [x, y] = toPx(p[0], p[1]);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // label
  if (label && points.length >= 3) {
    const cx = points.reduce((s, p) => s + p[0], 0) / points.length * canvas.width;
    const cy = points.reduce((s, p) => s + p[1], 0) / points.length * canvas.height;
    ctx.font = 'bold 13px sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000';
    ctx.strokeText(label, cx - 20, cy + 5);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, cx - 20, cy + 5);
  }
}

function drawInProgress() {
  if (drawing.length === 0) return;

  ctx.beginPath();
  const [x0, y0] = toPx(drawing[0][0], drawing[0][1]);
  ctx.moveTo(x0, y0);
  for (let i = 1; i < drawing.length; i++) {
    const [x, y] = toPx(drawing[i][0], drawing[i][1]);
    ctx.lineTo(x, y);
  }
  if (mousePos) ctx.lineTo(mousePos[0], mousePos[1]);

  ctx.strokeStyle = '#ffff00';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // first-vertex close hint circle
  if (drawing.length >= 3) {
    const [fx, fy] = toPx(drawing[0][0], drawing[0][1]);
    ctx.beginPath();
    ctx.arc(fx, fy, 8, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // vertex dots
  for (const p of drawing) {
    const [x, y] = toPx(p[0], p[1]);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffff00';
    ctx.fill();
  }
}

/* ================================================================
   Canvas events
================================================================ */
canvas.addEventListener('mousemove', e => {
  mousePos = canvasPos(e);
  if (drawing.length > 0) redraw();
});

canvas.addEventListener('mouseleave', () => {
  mousePos = null;
  if (drawing.length > 0) redraw();
});

let lastClickTime = 0;
canvas.addEventListener('click', e => {
  if (pendingPoly) return;

  const now = Date.now();
  // dblclick fires click×2 → ignore second click within 300ms
  if (now - lastClickTime < 300) { lastClickTime = now; return; }
  lastClickTime = now;

  const [cx, cy] = canvasPos(e);
  drawing.push(toNorm(cx, cy));
  setStatus(`꼭짓점 ${drawing.length}개 추가됨 — 더블클릭으로 완성 | ESC 취소`, 'warn');
  redraw();
});

canvas.addEventListener('dblclick', e => {
  if (pendingPoly) return;
  if (drawing.length < 3) {
    setStatus('꼭짓점이 3개 이상 필요합니다', 'err');
    return;
  }
  pendingPoly = drawing.slice();
  drawing = [];
  formSec.style.display = 'block';
  updateZoneTypeFieldsVisibility();
  document.getElementById('fName').focus();
  document.getElementById('fPriority').value = rois.length + 1;
  setStatus('ROI 정보를 입력하고 [ROI 추가]를 누르세요', 'warn');
  redraw();
});

/* ================================================================
   Audio upload — 파일 선택 즉시 Pi로 업로드하고 경로를 자동 반영
================================================================ */
function resetAudioPick() {
  pendingAudioPath = '';
  audioPick.value = '';
  audioStatusEl.textContent = '';
}

async function uploadAudio(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/audio/upload', { method: 'POST', body: fd });
  if (!res.ok) throw new Error(await res.text());
  return (await res.json()).path;
}

audioPick.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) { resetAudioPick(); return; }
  audioStatusEl.textContent = `⏳ 업로드 중... (${file.name})`;
  audioStatusEl.className = 'roi-meta';
  try {
    pendingAudioPath = await uploadAudio(file);
    audioStatusEl.textContent = `✅ 업로드됨: ${pendingAudioPath}`;
    audioStatusEl.className = 's-ok';
  } catch (err) {
    pendingAudioPath = '';
    audioStatusEl.textContent = `❌ 업로드 실패: ${err.message}`;
    audioStatusEl.className = 's-err';
  }
});

function pickAudioFor(i) {
  audioTargetIndex = i;
  existingAudioPick.value = '';
  existingAudioPick.click();
}

existingAudioPick.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || audioTargetIndex === null) return;
  const roiName = rois[audioTargetIndex].name;
  setStatus(`⏳ 업로드 중... (${file.name})`, 'warn');
  try {
    const path = await uploadAudio(file);
    rois[audioTargetIndex].audio_file = path;
    renderList();
    await saveToServer();
    setStatus(`✅ '${roiName}' 오디오 적용 및 저장 완료 — 기기가 2초 이내 자동 반영합니다`, 'ok');
  } catch (err) {
    setStatus(`❌ 업로드 실패: ${err.message}`, 'err');
  } finally {
    audioTargetIndex = null;
  }
});

/* ================================================================
   Utilities
================================================================ */
function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = type === 'err' ? 's-err' : type === 'warn' ? 's-warn' : 's-ok';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}

/* ================================================================
   Device status — Pi 가동시간/CPU온도/부하/메모리 (헤더에 표시, 10초 주기 갱신)
================================================================ */
function formatUptime(sec) {
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return `${d}일 ${h}시간`;
  if (h > 0) return `${h}시간 ${m}분`;
  return `${m}분`;
}

async function loadDeviceStatus() {
  const el = document.getElementById('deviceStatusBar');
  try {
    const res = await fetch('/api/device/status');
    const s = await res.json();
    const parts = [];
    if (s.uptime_seconds != null) parts.push(`가동 ${formatUptime(s.uptime_seconds)}`);
    if (s.cpu_temp_c != null) {
      const cls = s.cpu_temp_c >= 80 ? 's-err' : s.cpu_temp_c >= 70 ? 's-warn' : 's-ok';
      parts.push(`<span class="${cls}">${s.cpu_temp_c}°C</span>`);
    }
    if (s.load_avg) parts.push(`부하 ${s.load_avg.map(v => v.toFixed(1)).join('/')}`);
    if (s.mem_used_mb != null && s.mem_total_mb != null) {
      parts.push(`메모리 ${Math.round(s.mem_used_mb)}/${Math.round(s.mem_total_mb)}MB`);
    }
    el.innerHTML = parts.length ? parts.join(' &nbsp;|&nbsp; ') : '';
  } catch (e) {
    el.textContent = '';
  }
}
