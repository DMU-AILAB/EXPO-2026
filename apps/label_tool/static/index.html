<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionGuide — 지팡이 데이터셋 사람 라벨 보완</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #16213e;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
}
header h1 { font-size: 16px; color: #e94560; white-space: nowrap; }
#progressWrap { flex: 1; display: flex; align-items: center; gap: 8px; }
#progressBar { flex: 1; height: 10px; background: #0f3460; border-radius: 5px; overflow: hidden; }
#progressFill { height: 100%; background: #27ae60; width: 0%; transition: width .2s; }
#progressText { font-size: 12px; color: #aaa; white-space: nowrap; }
main { display: flex; flex: 1; overflow: hidden; }
#viewer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d1a;
  position: relative;
  overflow: hidden;
}
#canvas { cursor: crosshair; background: #000; }
#doneMsg {
  display: none;
  font-size: 22px;
  color: #27ae60;
  text-align: center;
}
#panel {
  width: 300px;
  background: #16213e;
  padding: 16px;
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#panel h2 { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: .5px; }
.file-info { font-size: 12px; color: #ccc; word-break: break-all; }
.btn {
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  width: 100%;
}
.btn-save { background: #27ae60; color: #fff; }
.btn-save:hover { background: #2ecc71; }
.btn-sec { background: #0f3460; color: #fff; }
.btn-sec:hover { background: #1a5490; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover { background: #e74c3c; }
.btn-cls { background: #0f3460; color: #9bb; border: 2px solid transparent; }
.btn-cls.active { border-color: #e94560; color: #fff; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { width: auto; flex: 1; }
#boxList { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.box-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f3460;
  padding: 5px 8px;
  border-radius: 4px;
}
.box-item button {
  background: none;
  border: none;
  color: #e74c3c;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
}
.hint-box {
  font-size: 11px;
  color: #888;
  line-height: 1.6;
  background: #0d0d1a;
  padding: 10px;
  border-radius: 6px;
}
.legend { display: flex; gap: 14px; font-size: 11px; }
.legend span { display: flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>

<header>
  <h1>🏷 라벨 보완·검수</h1>
  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <span id="progressText">로딩 중...</span>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:#3498db"></i>지팡이</span>
    <span><i class="swatch" style="background:#27ae60"></i>사람</span>
    <span><i class="swatch" style="background:#f39c12"></i>자동검출(검수 전)</span>
  </div>
</header>

<main>
  <div id="viewer">
    <canvas id="canvas"></canvas>
    <div id="doneMsg">🎉 모든 이미지 검토 완료!<br><span id="doneStats"></span></div>
  </div>

  <div id="panel">
    <div>
      <h2>현재 파일</h2>
      <div class="file-info" id="fileInfo">-</div>
    </div>

    <div>
      <h2>그릴 클래스</h2>
      <div class="btn-row" id="classToggle">
        <button class="btn btn-cls active" data-cls="1">🧑 사람 <small>(1)</small></button>
        <button class="btn btn-cls" data-cls="0">🦯 지팡이 <small>(2)</small></button>
      </div>
    </div>

    <div>
      <h2>박스 (<span id="boxCount">0</span>)</h2>
      <div id="boxList"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-sec" id="btnPrev">◀ 이전</button>
      <button class="btn btn-danger" id="btnUndo">실행취소</button>
    </div>
    <div>
      <label style="font-size:11px; color:#999">제안 방식</label>
      <select id="suggestProvider" style="width:100%; padding:6px; border-radius:5px; background:#0f3460; color:#fff; border:none">
        <option value="local_yolo">로컬 YOLO(COCO, 추천 — 빠름/무료)</option>
        <option value="openai">OpenAI GPT vision (API 키 필요)</option>
      </select>
    </div>
    <button class="btn btn-sec" id="btnSuggest">🤖 사람 박스 다시 제안받기</button>
    <div id="aiStatus" style="font-size:11px; color:#888; min-height:14px"></div>
    <button class="btn btn-save" id="btnSaveNext">저장하고 다음 ▶</button>

    <div class="hint-box">
      • 새 이미지를 열면 <b>이미 라벨된 것과 겹치지 않는</b> 자동검출만 주황색으로
        표시됩니다 — 맞으면 두고, 틀리면 지우고 저장하세요<br>
      • 빠진 대상은 캔버스에 드래그해서 추가. <b>1/2 키로 사람↔지팡이 전환</b><br>
      • 대상이 없으면 제안을 다 지우고 바로 "저장하고 다음"<br>
      • 단축키: Enter=저장·다음, Backspace=실행취소, ←=이전, 1=사람, 2=지팡이
    </div>
  </div>
</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const viewer = document.getElementById('viewer');

let img = new Image();
let current = null;      // 서버 아이템 {split, filename, cane_boxes, person_boxes, auto_boxes, index}
// 편집 중인 전체 박스. {cx,cy,w,h,cls,source} — cls: 0=지팡이 1=사람, source: 'manual'|'ai'
// (source는 "아직 검수 전"이라는 표시일 뿐, 저장 시엔 클래스와 좌표만 보낸다)
let boxes = [];
let drawClass = 1;       // 지금 드래그하면 그려질 클래스 (1=사람)
let dragStart = null;    // 드래그 시작 캔버스 픽셀 좌표
let dragCurrent = null;
let aiBusy = false;

function px2norm(x, y) {
  return [x / canvas.width, y / canvas.height];
}
function norm2px(cx, cy, w, h) {
  return [
    (cx - w / 2) * canvas.width,
    (cy - h / 2) * canvas.height,
    w * canvas.width,
    h * canvas.height,
  ];
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  // 사람(초록) / 지팡이(파랑) / 자동검출은 검수 전이라 주황
  ctx.lineWidth = 2;
  boxes.forEach(({ cx, cy, w, h, cls, source }) => {
    const [x, y, bw, bh] = norm2px(cx, cy, w, h);
    const color = source === 'ai' ? '#f39c12' : (cls === 0 ? '#3498db' : '#27ae60');
    ctx.strokeStyle = color;
    ctx.fillStyle = color.replace('#', 'rgba(').length ? hexA(color, 0.15) : color;
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeRect(x, y, bw, bh);
  });

  // 드래그 중인 미리보기 — 파란 점선
  if (dragStart && dragCurrent) {
    const x = Math.min(dragStart[0], dragCurrent[0]);
    const y = Math.min(dragStart[1], dragCurrent[1]);
    const w = Math.abs(dragCurrent[0] - dragStart[0]);
    const h = Math.abs(dragCurrent[1] - dragStart[1]);
    ctx.strokeStyle = '#3498db';
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
  }
}

function renderBoxList() {
  const nP = boxes.filter(b => b.cls === 1).length;
  const nC = boxes.filter(b => b.cls === 0).length;
  document.getElementById('boxCount').textContent = `사람 ${nP} · 지팡이 ${nC}`;
  document.getElementById('boxList').innerHTML = boxes.map((b, i) => `
    <div class="box-item">
      <span style="color:${b.source === 'ai' ? '#f39c12' : (b.cls === 0 ? '#3498db' : '#27ae60')}">
        ${b.cls === 0 ? '🦯 지팡이' : '🧑 사람'}${b.source === 'ai' ? ' (자동)' : ''}
      </span>
      <button onclick="removeBox(${i})">✕</button>
    </div>
  `).join('') || '<div style="color:#666">아직 없음</div>';
}

function removeBox(i) {
  boxes.splice(i, 1);
  renderBoxList();
  redraw();
}

function setDrawClass(c) {
  drawClass = c;
  document.querySelectorAll('.btn-cls').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.cls) === c));
}

function fitCanvas() {
  if (!img.naturalWidth) return;
  const availW = viewer.clientWidth - 20;
  const availH = viewer.clientHeight - 20;
  const scale = Math.min(availW / img.naturalWidth, availH / img.naturalHeight, 1.5);
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  redraw();
}

window.addEventListener('resize', fitCanvas);

function loadItem(data) {
  if (data.done) {
    canvas.style.display = 'none';
    document.getElementById('doneMsg').style.display = 'block';
    refreshStats().then(s => {
      document.getElementById('doneStats').textContent = `${s.reviewed} / ${s.total} 검토됨`;
    });
    return;
  }
  canvas.style.display = 'block';
  document.getElementById('doneMsg').style.display = 'none';
  current = data;
  boxes = [
    ...(data.cane_boxes || []).map(([cx, cy, w, h]) => ({ cx, cy, w, h, cls: 0, source: 'manual' })),
    ...(data.person_boxes || []).map(([cx, cy, w, h]) => ({ cx, cy, w, h, cls: 1, source: 'manual' })),
    // 서버가 기존 라벨과 겹치지 않는 것만 걸러서 준다 — 중복으로 쌓이지 않는다
    ...(data.auto_boxes || []).map(([cx, cy, w, h]) => ({ cx, cy, w, h, cls: 1, source: 'ai' })),
  ];
  document.getElementById('fileInfo').textContent = `[${data.split}] ${data.filename} (#${data.index})`;
  document.getElementById('aiStatus').textContent = '';
  img = new Image();
  img.onload = () => {
    fitCanvas();
    renderBoxList();
    const nAuto = (data.auto_boxes || []).length;
    document.getElementById('aiStatus').textContent =
      nAuto ? `자동검출 ${nAuto}개(주황) — 확인 후 저장하세요` : '';
  };
  img.src = `/api/image/${data.split}/${data.filename}`;
}

async function loadNext(afterIndex) {
  const res = await fetch(`/api/next?after_index=${afterIndex}`);
  loadItem(await res.json());
}

async function loadPrev() {
  if (!current || current.index <= 0) return;
  const res = await fetch(`/api/item/${current.index - 1}`);
  loadItem(await res.json());
}

async function saveAndNext() {
  if (!current) return;
  const pick = c => boxes.filter(b => b.cls === c).map(({ cx, cy, w, h }) => [cx, cy, w, h]);
  const res = await fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      split: current.split, filename: current.filename,
      person_boxes: pick(1), cane_boxes: pick(0),
    }),
  });
  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    alert(`저장 실패: ${b.detail || res.status}`);
    return;
  }
  await refreshStats();
  await loadNext(current.index);
}

async function suggestWithAI(auto = false) {
  if (!current || aiBusy) return;
  const targetIndex = current.index;
  const aiStatus = document.getElementById('aiStatus');
  aiBusy = true;
  const btn = document.getElementById('btnSuggest');
  const originalText = btn.textContent;
  btn.textContent = '🤖 분석 중...';
  btn.disabled = true;
  aiStatus.textContent = '자동 제안 요청 중...';
  const provider = document.getElementById('suggestProvider').value;
  try {
    const res = await fetch(`/api/suggest/${targetIndex}?provider=${provider}`, { method: 'POST' });
    const body = await res.json();
    // 응답이 오는 동안 사용자가 이미 다른 이미지로 넘어갔으면 결과를 버린다(잘못된 이미지에 박스가 붙는 걸 방지).
    if (!current || current.index !== targetIndex) return;
    if (!res.ok) {
      aiStatus.textContent = `제안 실패: ${body.detail || res.status}`;
      if (!auto) alert(`AI 제안 실패: ${body.detail || res.status}`);
      return;
    }
    // 이미 화면에 있는 박스와 겹치는 제안은 버린다 — 버튼을 여러 번 눌러도 쌓이지 않는다
    const iou = (a, b) => {
      const [ax1, ay1, ax2, ay2] = [a.cx - a.w / 2, a.cy - a.h / 2, a.cx + a.w / 2, a.cy + a.h / 2];
      const [bx1, by1, bx2, by2] = [b.cx - b.w / 2, b.cy - b.h / 2, b.cx + b.w / 2, b.cy + b.h / 2];
      const [x1, y1, x2, y2] = [Math.max(ax1, bx1), Math.max(ay1, by1), Math.min(ax2, bx2), Math.min(ay2, by2)];
      if (x2 <= x1 || y2 <= y1) return 0;
      const i = (x2 - x1) * (y2 - y1);
      return i / (a.w * a.h + b.w * b.h - i);
    };
    let added = 0;
    body.boxes.forEach(([cx, cy, w, h]) => {
      const nb = { cx, cy, w, h, cls: 1, source: 'ai' };
      if (boxes.every(b => iou(nb, b) < 0.3)) { boxes.push(nb); added++; }
    });
    renderBoxList();
    redraw();
    aiStatus.textContent = added
      ? `제안 ${added}개 추가 — 확인 후 저장하세요`
      : '새로 추가할 제안 없음 (미검출이거나 이미 라벨됨)';
  } catch (e) {
    aiStatus.textContent = `제안 실패: ${e.message}`;
    if (!auto) alert(`AI 제안 실패: ${e.message}`);
  } finally {
    aiBusy = false;
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function refreshStats() {
  const res = await fetch('/api/stats');
  const s = await res.json();
  const pct = s.total > 0 ? Math.round((s.reviewed / s.total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${s.reviewed} / ${s.total} (${pct}%)`;
  return s;
}

// ── 마우스로 박스 드래그 그리기 ──
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  dragStart = [e.clientX - rect.left, e.clientY - rect.top];
  dragCurrent = dragStart;
});
canvas.addEventListener('mousemove', e => {
  if (!dragStart) return;
  const rect = canvas.getBoundingClientRect();
  dragCurrent = [e.clientX - rect.left, e.clientY - rect.top];
  redraw();
});
window.addEventListener('mouseup', e => {
  if (!dragStart) return;
  const rect = canvas.getBoundingClientRect();
  const end = [
    Math.max(0, Math.min(e.clientX - rect.left, canvas.width)),
    Math.max(0, Math.min(e.clientY - rect.top, canvas.height)),
  ];
  const x = Math.min(dragStart[0], end[0]);
  const y = Math.min(dragStart[1], end[1]);
  const w = Math.abs(end[0] - dragStart[0]);
  const h = Math.abs(end[1] - dragStart[1]);
  dragStart = null;
  dragCurrent = null;
  if (w < 4 || h < 4) { redraw(); return; }  // 너무 작은 실수 클릭 무시
  const [ncx, ncy] = px2norm(x + w / 2, y + h / 2);
  const [nw, nh] = [w / canvas.width, h / canvas.height];
  boxes.push({ cx: ncx, cy: ncy, w: nw, h: nh, cls: drawClass, source: 'manual' });
  renderBoxList();
  redraw();
});

document.getElementById('btnSaveNext').addEventListener('click', saveAndNext);
document.getElementById('btnSuggest').addEventListener('click', suggestWithAI);
document.getElementById('btnUndo').addEventListener('click', () => {
  boxes.pop();
  renderBoxList();
  redraw();
});
document.getElementById('btnPrev').addEventListener('click', loadPrev);
document.querySelectorAll('.btn-cls').forEach(b =>
  b.addEventListener('click', () => setDrawClass(Number(b.dataset.cls))));

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); saveAndNext(); }
  else if (e.key === 'Backspace') { e.preventDefault(); boxes.pop(); renderBoxList(); redraw(); }
  else if (e.key === '1') { setDrawClass(1); }
  else if (e.key === '2') { setDrawClass(0); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); loadPrev(); }
});

refreshStats();
loadNext(-1);
</script>
</body>
</html>
