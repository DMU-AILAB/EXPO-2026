# E3 — 다중 시드 확정 (seed 2) · 기준선 v10(pedcctv 100%)
#
# E2는 단일 시드라 축마다 순위가 어긋났다 — 실외 통과 프레임은 ped50 1위인데
# 실내 탐지는 ped25 1위이고 ped50이 꼴찌였다(리포트 §14-3-1). 런 간 분산이
# 효과 크기와 비슷하다는 뜻이라, 세 시드 평균으로만 판정한다.
#
# **기준선도 같이 3시드로 만든다.** 변형만 3시드로 재고 기준선을 1시드로 두면,
# 기준선이 운 좋은/나쁜 draw였을 때 그대로 오판한다 — 분산이 바로 이 실험의
# 쟁점이므로 한쪽만 평균내는 것은 비교가 성립하지 않는다.
#
# 데이터·증강·epoch는 E2와 동일하고 seed만 다르다.
# ★ workers를 8 → 3으로 낮췄다. 성능 튜닝이 아니라 **이 기기에서 학습이 끝까지
# 돌게 하기 위한 조치**다. 실측(이 저장소, RAM 15GB):
#
#   workers=8 → 사용 12.5GB / 여유 3.2GB / 프로세스 29개  → 기동 단계에서 반복 강제종료
#   workers=3 → 사용  8.2GB / 여유 7.6GB / 프로세스 11개  → 여유 확보
#
# **여섯 런 전부 같은 값이어야 한다.** 워커 수가 바뀌면 배치가 워커에 배정되는
# 순서가 달라져 배치별 증강 RNG 스트림이 달라진다 — 시드 간 차이를 재는 실험에서
# 워커 수가 섞이면 그 차이가 시드 탓인지 워커 탓인지 가를 수 없다. 그래서 이미
# workers=8로 완주했던 base_s1도 폐기하고(runs/..._workers8로 보존) 다시 돌린다.

task: detect
mode: train

model: yolov8n.pt
data: datasets/data_v2_nolkc.yaml

epochs: 100
patience: 30
batch: 64
imgsz: 320          # 학습 이미지 원본이 지팡이 416² / 사람 224²라 그 이상은 업샘플링이다
device: 0
workers: 3
seed: 2
deterministic: true
amp: true

project: /home/ubuntu/expo/runs
name: white_cane_v14_base_s2

# --- 증강 A안 -------------------------------------------------------------
# v3~v8 전 실험이 ultralytics 기본값 그대로였다. 한 번도 손대지 않은 영역이라
# 가장 큰 미개척 이득이 여기에 있다. 각 변경의 근거:

degrees: 10.0
# 기본값 0. **흰 지팡이는 기울기 각도 자체가 정체성**인데 회전 증강이 전무했다.
# 실측: 지팡이 박스 종횡비(w/h)가 p5=0.20 ~ p50=0.97 ~ p95=2.06으로 모든 각도에
# 분포하고 35.5%가 대각선(정사각 박스)이다. 그런 객체에 회전 불변성을 데이터로만
# 가르치고 있었다.

scale: 0.7
# 기본값 0.5. 원근 거리 변화 = 소형 객체 재현율에 직결된다. 지팡이 박스의 15.8%가
# 정규화 면적 0.01 미만이고, 배포 환경(광각 CCTV 원거리)은 학습 데이터(중간 거리
# center-crop)보다 객체가 훨씬 작다 — 그 프레이밍 갭을 증강으로 메우는 축이다.

translate: 0.2
# 기본값 0.1. 부감 CCTV는 객체가 프레임 어디에나 나타난다.

multi_scale: 0.5
# 기본값 0.0. 스케일 다양성을 추가 데이터 없이 확보한다.

hsv_v: 0.6
# 기본값 0.4. 야외 역광/그림자 + 야간 대응. 현재 지팡이 학습 이미지는 평균밝기
# p1=64로 사실상 전량 주간이다(평균밝기<60인 이미지 0.25%).

close_mosaic: 20
# 기본값 10. 마지막에 모자이크를 끄고 실제 분포로 학습하는 기간을 늘려 operating
# point를 안정화한다 — INT8 양자화가 confidence 스케일에 민감해 중요하다.

mixup: 0.1
# A안 + mixup만 추가. 클래스 불균형(cane 9,454 : person 30,254) 완화 효과가 알려져
# 있으나, 두 이미지를 반투명 합성하므로 **얇고 저대비인 지팡이에는 해로울 수 있다**.
# 어느 쪽인지 데이터로 가르려고 A/B로 분리했다.
