# v9 기준선 — 누수 없는 분할(datasets/v2) 위에서 처음 학습하는 모델.
#
# 증강은 ultralytics 기본값 그대로다. v3~v8이 전부 이 값으로 학습됐으므로, 이 런이
# "데이터만 바뀌었을 때" 어떻게 되는지를 보여주는 대조군이 된다. 증강 변경 효과는
# train_v9_augA.yaml과의 차이로만 읽는다.
#
# 백본은 yolov8n — 이 단계에서 백본은 통제변수다. 목적은 데이터/증강 효과 측정이고
# 그 효과는 어느 백본에서도 같은 방향으로 나타난다. yolov8n을 쓰는 실무적 이유는
# 학습이 20% 빠르고(3,374s vs yolo11n 4,050s) v1~v6과 같은 계보라 비교가 되기
# 때문이다. 백본 우열은 데이터·증강이 확정된 뒤 3종 공정 비교로 가린다.
#
# 기존의 "100ep 학습 → best.pt에서 40ep 파인튜닝" 2단계를 쓰지 않는다. 두 단계가
# 같은 데이터라 전이학습의 정당성이 없고(실질 140ep + LR 재가열), args.yaml의
# model:이 다른 run을 가리켜 계보 추적이 번거로워진다.

task: detect
mode: train

model: yolo11n.pt
data: datasets/data_v2.yaml

epochs: 100
patience: 30
batch: 64
imgsz: 320          # 학습 이미지 원본이 지팡이 416² / 사람 224²라 그 이상은 업샘플링이다
device: 0
workers: 8
seed: 0
deterministic: true
amp: true

project: /home/ubuntu/expo/runs
name: white_cane_v10_v11n

# --- 증강 A안 -------------------------------------------------------------
# v3~v8 전 실험이 ultralytics 기본값 그대로였다. 한 번도 손대지 않은 영역이라
# 가장 큰 미개척 이득이 여기에 있다. 각 변경의 근거:

degrees: 10.0
# 기본값 0. **흰 지팡이는 기울기 각도 자체가 정체성**인데 회전 증강이 전무했다.
# 실측: 지팡이 박스 종횡비(w/h)가 p5=0.20 ~ p50=0.97 ~ p95=2.06으로 모든 각도에
# 분포하고 35.5%가 대각선(정사각 박스)이다. 그런 객체에 회전 불변성을 데이터로만
# 가르치고 있었다.

scale: 0.7
# 기본값 0.5. 원근 거리 변화 = 소형 객체 재현율에 직결된다. 지팡이 박스의 15.8%가
# 정규화 면적 0.01 미만이고, 배포 환경(광각 CCTV 원거리)은 학습 데이터(중간 거리
# center-crop)보다 객체가 훨씬 작다 — 그 프레이밍 갭을 증강으로 메우는 축이다.

translate: 0.2
# 기본값 0.1. 부감 CCTV는 객체가 프레임 어디에나 나타난다.

multi_scale: 0.5
# 기본값 0.0. 스케일 다양성을 추가 데이터 없이 확보한다.

hsv_v: 0.6
# 기본값 0.4. 야외 역광/그림자 + 야간 대응. 현재 지팡이 학습 이미지는 평균밝기
# p1=64로 사실상 전량 주간이다(평균밝기<60인 이미지 0.25%).

close_mosaic: 20
# 기본값 10. 마지막에 모자이크를 끄고 실제 분포로 학습하는 기간을 늘려 operating
# point를 안정화한다 — INT8 양자화가 confidence 스케일에 민감해 중요하다.

mixup: 0.1
# A안 + mixup만 추가. 클래스 불균형(cane 9,454 : person 30,254) 완화 효과가 알려져
# 있으나, 두 이미지를 반투명 합성하므로 **얇고 저대비인 지팡이에는 해로울 수 있다**.
# 어느 쪽인지 데이터로 가르려고 A/B로 분리했다.
